spring.application.name=loud-feliz-api
spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adega_tabacaria?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

app.jwt.segredo=${JWT_SECRET:}
app.jwt.validade-horas=12
app.cors.origens=${CORS_ORIGINS:http://localhost:4200}
app.admin.usuario=${ADMIN_USER:dono}
app.admin.senha=${ADMIN_PASSWORD:admin123}
app.pagamento.simulado=${PAGAMENTO_SIMULADO:true}
app.login.max-tentativas=${LOGIN_MAX_TENTATIVAS:5}
app.login.bloqueio-minutos=${LOGIN_BLOQUEIO_MINUTOS:15}
app.pedidos.expiracao.intervalo-ms=60000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
server.tomcat.threads.max=30
