services:
  - type: web
    name: loud-feliz-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://loud-feliz-web*.onrender.com,http://localhost:4200

  - type: web
    name: loud-feliz-web
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci --legacy-peer-deps && node scripts/definir-api.mjs && npm run build
    staticPublishPath: ./frontend/dist/loud-feliz-web/browser
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: API_URL
        value: https://loud-feliz-api.onrender.com/api
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
