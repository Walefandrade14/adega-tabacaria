<section class="page-top">
  <div class="container">
    <span class="eyebrow ruled">Sua conta</span>
    <h1 class="gothic">Entrar</h1>
    <p class="caps">Seus dados e endereços de entrega</p>
  </div>
</section>

<section class="container corpo">
  <form class="cartao form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    @if (erro()) {
      <p class="alerta erro" role="alert"><i class="bi bi-exclamation-octagon"></i> {{ erro() }}</p>
    }

    <label class="campo">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" [class.erro]="invalido('email')" />
      @if (invalido('email')) {
        <small>Informe um e-mail válido.</small>
      }
    </label>

    <label class="campo">
      <span>Senha</span>
      <div class="senha">
        <input [type]="verSenha() ? 'text' : 'password'" formControlName="senha" autocomplete="current-password" [class.erro]="invalido('senha')" />
        <button type="button" class="olho" (click)="verSenha.set(!verSenha())" [attr.aria-label]="verSenha() ? 'Esconder senha' : 'Mostrar senha'">
          <i class="bi" [class.bi-eye]="!verSenha()" [class.bi-eye-slash]="verSenha()"></i>
        </button>
      </div>
      @if (invalido('senha')) {
        <small>Informe sua senha.</small>
      }
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="enviando()">
      @if (enviando()) {
        Entrando…
      } @else {
        Entrar <i class="bi bi-arrow-right"></i>
      }
    </button>

    @if (lento()) {
      <p class="lento"><i class="bi bi-hourglass-split"></i> O servidor gratuito está acordando. Pode levar até 1 minuto.</p>
    }

    <div class="separador"><span>Novo por aqui?</span></div>
    <a routerLink="/cadastro" class="btn btn-outline">Criar minha conta</a>
  </form>

  <p class="funcionario">
    Trabalha na loja? <a routerLink="/admin/entrar" class="link-ouro">Acesse a área do funcionário</a>
  </p>
</section>
