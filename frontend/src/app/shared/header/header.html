<header class="header">
  <div class="container bar">
    <app-logo />

    <button
      type="button"
      class="toggle"
      [attr.aria-expanded]="menuAberto()"
      aria-controls="menu-principal"
      (click)="alternarMenu()">
      <i class="bi" [class.bi-list]="!menuAberto()" [class.bi-x-lg]="menuAberto()"></i>
      <span class="sr-only">Menu</span>
    </button>

    <nav id="menu-principal" class="nav" [class.open]="menuAberto()" aria-label="Principal">
      @for (link of links; track link.rota) {
        <a
          [routerLink]="link.rota"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exato }"
          (click)="fecharMenu()">
          {{ link.rotulo }}
        </a>
      }
      @if (auth.cliente()) {
        <a routerLink="/minha-conta" routerLinkActive="active" class="conta" (click)="fecharMenu()">
          <i class="bi bi-person-circle"></i> {{ auth.primeiroNome() || 'Minha conta' }}
        </a>
      } @else if (auth.funcionario()) {
        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="conta" (click)="fecharMenu()">
          <i class="bi bi-speedometer2"></i> Painel
        </a>
      } @else {
        <a routerLink="/entrar" routerLinkActive="active" class="conta" (click)="fecharMenu()">
          <i class="bi bi-person"></i> Entrar
        </a>
      }
    </nav>
  </div>
</header>
